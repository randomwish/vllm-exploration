[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-energy-campaign"
version = "0.1.0"
description = "Reproducible SGLang energy-to-finish experiment harness"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "nvidia-ml-py>=13.580,<14",
  "transformers>=5.3,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sgenergy = "sgenergy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

