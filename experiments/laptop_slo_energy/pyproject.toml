[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-slo-energy"
version = "0.1.0"
description = "Local GuideLLM, energy, and eBPF experiment harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
benchmark = ["guidellm[recommended]==0.7.2"]

[project.scripts]
laptop-energy = "laptop_energy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
